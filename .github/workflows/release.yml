name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test MusicIsland.Tests/MusicIsland.Tests.csproj -c Release

      - name: Build & Publish Self-Contained App
        # Stamp the tag (v1.2.0 -> 1.2.0) into the exe so the in-app updater can compare versions
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { $version = "0.0.0" }
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o ./publish

      - name: Create Release Zip
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./MusicIsland-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MusicIsland ${{ github.ref_name }}
          files: MusicIsland-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
